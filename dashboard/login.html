<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Repoplus — Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0F172A; --card: #1E293B; --border: rgba(255,255,255,0.08);
      --accent: #6C63FF; --text: #F1F5F9; --sub: #94A3B8; --muted: #475569;
      --red: #f87171; --green: #4ade80;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    body::before {
      content: ''; position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; }
    .logo { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 32px; }
    .logo span { color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: var(--sub); margin-bottom: 28px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--sub); margin-bottom: 7px; }
    input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; font-size: 15px; color: var(--text);
      font-family: inherit; outline: none; transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); background: rgba(108,99,255,0.06); }
    input::placeholder { color: var(--muted); }
    .btn {
      width: 100%; padding: 14px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 15px; font-weight: 700; font-family: inherit; transition: all .2s;
      background: var(--accent); color: #fff;
      box-shadow: 0 6px 24px rgba(108,99,255,0.3); margin-top: 6px;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    .btn-text { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-google {
      width: 100%; padding: 12px; border-radius: 10px; cursor: pointer;
      font-size: 14px; font-weight: 600; font-family: inherit;
      background: #fff; color: #111; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      text-decoration: none; transition: opacity .2s; margin-bottom: 14px;
    }
    .btn-google:hover { opacity: 0.92; }
    .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
    .divider {
      display: flex; align-items: center; gap: 10px;
      color: var(--muted); font-size: 12px;
      margin: 8px 0 18px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .error-box {
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--red);
      margin-bottom: 18px; display: none;
    }
    .error-box.show { display: block; }
    .back-link {
      display: block; text-align: center; font-size: 14px; color: var(--sub);
      text-decoration: none; margin-top: 20px; transition: color .2s;
    }
    .back-link:hover { color: var(--text); }
    .signup-link { text-align: center; font-size: 13px; color: var(--sub); margin-top: 16px; }
    .signup-link a { color: var(--accent); text-decoration: none; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">repo<span>plus</span></div>
  <div class="card">
    <h1>Добро пожаловать</h1>
    <p class="subtitle">Войдите в панель управления</p>

    <div class="error-box" id="errorBox"></div>

    <a class="btn-google" id="googleBtn" href="#" onclick="loginGoogle();return false">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18A10.99 10.99 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.83z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.83C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
      Войти через Google
    </a>

    <div class="divider">или</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@agency.kz" required autocomplete="email"/>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button class="btn" type="submit" id="submitBtn">
        <span class="btn-text" id="btnText">Войти</span>
      </button>
    </form>

    <div class="signup-link">
      Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>
  </div>
  <a href="index.html" class="back-link">← Вернуться на главную</a>
</div>

<script>
const API = 'https://repoplus-production.up.railway.app';

if (localStorage.getItem('rp_access_token')) {
  window.location.href = 'dashboard.html';
}

// Показать ошибку из query params (?error=...)
(function showQueryError() {
  const p = new URLSearchParams(window.location.search);
  const err = p.get('error');
  if (!err) return;
  const msgs = {
    google_denied:        'Вход через Google отменён',
    google_failed:        'Не удалось войти через Google',
    google_not_configured:'Вход через Google пока не настроен',
    pending_approval:     'Ваш аккаунт ожидает подтверждения администратора',
    missing_token:        'Не удалось получить токен',
  };
  const eb = document.getElementById('errorBox');
  eb.textContent = msgs[err] || ('Ошибка: ' + err);
  eb.classList.add('show');
  window.history.replaceState({}, '', '/login.html');
})();

function loginGoogle() {
  window.location.href = API + '/api/auth/google/init';
}

async function handleLogin(e) {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('submitBtn');
  const btnText  = document.getElementById('btnText');
  const errorBox = document.getElementById('errorBox');

  btn.disabled = true;
  btnText.innerHTML = '<div class="spinner"></div> Вхожу...';
  errorBox.classList.remove('show');

  try {
    const resp = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Ошибка входа');

    localStorage.setItem('rp_access_token',  data.accessToken);
    localStorage.setItem('rp_refresh_token', data.refreshToken);
    localStorage.setItem('rp_user',          JSON.stringify(data.user));
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
    btn.disabled = false;
    btnText.textContent = 'Войти';
  }
}
</script>
</body>
</html>
