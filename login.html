<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Repoplus — Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0F172A; --card: #1E293B; --border: rgba(255,255,255,0.08);
      --accent: #6C63FF; --text: #F1F5F9; --sub: #94A3B8; --muted: #475569;
      --red: #f87171; --green: #4ade80;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    body::before {
      content: ''; position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; }

    .logo { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 32px; }
    .logo span { color: var(--accent); }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 40px 36px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: var(--sub); margin-bottom: 28px; }

    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--sub); margin-bottom: 7px; }
    input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; font-size: 15px; color: var(--text);
      font-family: inherit; outline: none; transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); background: rgba(108,99,255,0.06); }
    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%; padding: 14px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 15px; font-weight: 700; font-family: inherit; transition: all .2s;
      background: var(--accent); color: #fff;
      box-shadow: 0 6px 24px rgba(108,99,255,0.3);
      margin-top: 6px;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    .btn-text { display: flex; align-items: center; justify-content: center; gap: 8px; }

    .error-box {
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--red);
      margin-bottom: 18px; display: none;
    }
    .error-box.show { display: block; }

    .divider { text-align: center; font-size: 13px; color: var(--muted); margin: 20px 0; }
    .back-link {
      display: block; text-align: center; font-size: 14px; color: var(--sub);
      text-decoration: none; margin-top: 20px; transition: color .2s;
    }
    .back-link:hover { color: var(--text); }

    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">repo<span>plus</span></div>
  <div class="card">
    <h1>Добро пожаловать</h1>
    <p class="subtitle">Войдите в панель управления</p>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@repoplus.kz" required autocomplete="email"/>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button class="btn" type="submit" id="submitBtn">
        <span class="btn-text" id="btnText">Войти</span>
      </button>
    </form>
  </div>
  <a href="index.html" class="back-link">← Вернуться на главную</a>
</div>

<script>
const API = 'https://repoplus-production.up.railway.app';

// Если уже залогинен — редирект на дашборд
if (localStorage.getItem('rp_access_token')) {
  window.location.href = 'dashboard.html';
}

async function handleLogin(e) {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('submitBtn');
  const btnText  = document.getElementById('btnText');
  const errorBox = document.getElementById('errorBox');

  // Loading state
  btn.disabled = true;
  btnText.innerHTML = '<div class="spinner"></div> Вхожу...';
  errorBox.classList.remove('show');

  try {
    const resp = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await resp.json();

    if (!resp.ok) {
      throw new Error(data.error || 'Ошибка входа');
    }

    // Сохраняем токены
    localStorage.setItem('rp_access_token',  data.accessToken);
    localStorage.setItem('rp_refresh_token', data.refreshToken);
    localStorage.setItem('rp_user',          JSON.stringify(data.user));

    // Редирект на дашборд
    window.location.href = 'dashboard.html';

  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
    btn.disabled = false;
    btnText.textContent = 'Войти';
  }
}
</script>
</body>
</html>
